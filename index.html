<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>r.barbers</title>
  <meta name="description" content="r.barbers — мужская парикмахерская / erkaklar soch turmagi">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Hanken+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- Mavzuni sahifa chizilishidan OLDIN o'rnatamiz (yaltirash bo'lmasligi uchun) -->
  <script>
    try {
      var t = localStorage.getItem("theme") ||
        (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <!-- data-i18n="kalit" — matn script.js dagi T lug'atidan olinadi (ru / uz) -->
  <header class="nav" id="top">
    <a class="logo" href="#top"><i class="mini-pole"></i>r.barbers</a>
    <nav>
      <a href="#xizmatlar" data-i18n="n_price"></a>
      <a href="#yozilish" data-i18n="n_contact"></a>
    </nav>
    <div class="nav-r">
      <div class="lang" role="group" aria-label="Язык / Til">
        <button data-lang="ru">RU</button><button data-lang="uz">UZ</button>
      </div>
      <button id="theme" class="icon-btn" aria-label="Dark / Light">
        <svg class="i-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <a class="btn sm" href="#yozilish" data-i18n="n_book"></a>
    </div>
  </header>

  <main>
    <section class="hero">
      <div>
        <h1><span><b data-i18n="h1a"></b></span><span><b data-i18n="h1b"></b></span></h1>
        <p class="lead" data-i18n="lead"></p>
        <div class="cta">
          <a class="btn" href="#yozilish" data-i18n="cta1"></a>
          <a class="btn ghost" href="#xizmatlar" data-i18n="cta2"></a>
        </div>
        <p class="open" id="open"><i></i><span></span></p>
      </div>
      <div class="hero-art">
        <div class="pole" aria-hidden="true"></div>
        <div class="arch">
          <img src="https://images.pexels.com/photos/7518736/pexels-photo-7518736.jpeg?auto=compress&cs=tinysrgb&w=900" alt="Barber" fetchpriority="high" onerror="this.remove()">
        </div>
      </div>
    </section>

    <div class="stripe" aria-hidden="true"></div>

    <section class="sec" id="xizmatlar">
      <div class="head">
        <h2 data-i18n="h_price"></h2>
        <div class="tabs" id="tabs" role="tablist">
          <button class="tab" role="tab" data-cat="all" aria-selected="true" data-i18n="t_all"></button>
          <button class="tab" role="tab" data-cat="soch" aria-selected="false" data-i18n="t_hair"></button>
          <button class="tab" role="tab" data-cat="soqol" aria-selected="false" data-i18n="t_beard"></button>
          <button class="tab" role="tab" data-cat="parvarish" aria-selected="false" data-i18n="t_care"></button>
          <button class="tab" role="tab" data-cat="kombo" aria-selected="false" data-i18n="t_combo"></button>
        </div>
      </div>
      <ul class="menu" id="menu"></ul>
    </section>



    <section class="sec book" id="yozilish">
      <div>
        <h2 data-i18n="h_book"></h2>
        <div class="info">
          <p><b data-i18n="i_hours"></b><span data-i18n="i_hours_v"></span></p>
          <p><b data-i18n="i_phone"></b><a href="tel:+998997894838">+998 99 789 48 38</a> — <span data-i18n="arman"></span></p>
          <p><a class="maplink" href="https://www.google.com/maps?q=41.275834,69.372918" target="_blank" rel="noopener" data-i18n="i_map"></a></p>
        </div>
      </div>

      <!-- Xarita: Google Maps embed -->
      <div class="map">
        <iframe src="https://www.google.com/maps/embed?pb=!1m13!1m8!1m3!1d5997.035588955534!2d69.372918!3d41.275834!3m2!1i1024!2i768!4f13.1!3m2!1m1!2zNDHCsDE2JzMzLjAiTiA2OcKwMjInMjIuNSJF!5e0!3m2!1sen!2s!4v1794623725527!5m2!1sen!2s" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" title="Map"></iframe>
      </div>
    </section>
  </main>

  <div class="stripe" aria-hidden="true"></div>
  <script src="script.js"></script>
</body>
</html>
